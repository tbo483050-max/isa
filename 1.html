<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISA超协终端</title>
<style>
:root{
  --bg:#070D18; --bg2:#10192C; --bg3:#0C1424;
  --primary:#3B82F6; --primary-dim:#1E3A6E; --gold:#E6C270;
  --danger:#EF4444; --ok:#34D399; --warn:#F59E0B; --violet:#A78BFA;
  --text:#E8EDF5; --text2:#93A0B8; --line:#243656; --mind:#9CA3AF;
  --shadow:0 12px 40px rgba(0,0,0,.35);
}
body[data-theme="gold"]{--bg:#0C0A07;--bg2:#17140E;--bg3:#120F0A;--primary:#E6C270;--primary-dim:#5C4A22;--text:#F6F0E4;--text2:#B7AA94;--line:#3A3120}
body[data-theme="violet"]{--bg:#100818;--bg2:#1A1028;--bg3:#140C20;--primary:#A78BFA;--primary-dim:#4C1D95;--line:#3B2760}
body[data-theme="ash"]{--bg:#121418;--bg2:#1C2028;--bg3:#181C22;--primary:#D1D5DB;--primary-dim:#3F4654;--text:#F3F4F6;--text2:#9CA3AF;--line:#323844;--gold:#E5E7EB}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;max-width:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--primary);border:0;color:#fff;min-height:44px;padding:10px 14px;border-radius:4px;margin:4px 4px 4px 0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body[data-theme="gold"] button,body[data-theme="ash"] button{color:#14120C}
button.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
button.danger{background:var(--danger);color:#fff}
button.small{min-height:36px;padding:6px 10px;font-size:13px}
button:disabled{opacity:.45}
input,select,textarea{width:100%;max-width:100%;background:#070B14;border:1px solid var(--line);border-radius:4px;padding:10px;margin:6px 0}
textarea{min-height:72px;resize:vertical}
.app{max-width:1100px;margin:0 auto;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg3);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.08em;color:var(--primary);font-size:16px}
.brand small{display:block;color:var(--text2);font-weight:400;letter-spacing:0;font-size:11px}
.top-actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:0;width:100%}
.sos{background:var(--danger);color:#fff;font-weight:700}
.sos.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
.hud{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:#0A1222;border-bottom:1px solid var(--line);font-size:12px}
.chip{border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--text2)}
.chip b{color:var(--text);font-weight:600}
.chip.bad{border-color:var(--danger);color:#FECACA}
.chip.warn{border-color:var(--warn);color:#FDE68A}
.chip.vio{border-color:var(--violet);color:#DDD6FE}
.clock{padding:6px 14px 0;color:var(--text2);font-size:12px}
.clock b{color:var(--text)}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{flex:0 0 auto;padding:12px 14px;min-height:44px;color:var(--text2);background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;margin:0}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.dot{display:inline-block;background:var(--danger);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;margin-left:4px;vertical-align:1px}
.view{padding:12px 14px 28px}
.card{background:var(--bg2);border:1px solid var(--line);padding:12px;margin:0 0 10px;position:relative;box-shadow:var(--shadow)}
.card:before{content:"";position:absolute;left:0;top:0;width:10px;height:10px;border-top:2px solid var(--primary);border-left:2px solid var(--primary)}
.card h3,.card h4{margin:0 0 8px;font-size:15px}
.muted{color:var(--text2);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input,.row select{width:auto;flex:1 1 120px;min-width:0;margin:0}
.grow{flex:1;min-width:0}
.chat{height:280px;overflow:auto;background:#070B14;border:1px solid var(--line);padding:8px;margin:8px 0}
.msg{margin:6px 0;font-size:14px;word-break:break-word}
.msg .who{color:var(--gold)}
.msg.self{text-align:right}
.msg.self .who{color:var(--primary)}
.msg.sys{color:var(--text2);font-size:13px}
.mind{color:var(--mind);font-size:11px;margin-top:2px}
.pic{color:#6B7280;font-size:12px}
.desk{display:none}
.stage{height:250px;perspective:760px;position:relative;overflow:hidden;border:1px solid var(--line);background:
  radial-gradient(ellipse at 50% 120%, rgba(59,130,246,.28), transparent 55%),
  repeating-linear-gradient(90deg, transparent 0 26px, rgba(59,130,246,.13) 27px),
  #070d18}
.fig{position:absolute;bottom:28px;left:50%;width:78px;text-align:center;transform-style:preserve-3d}
.fig .sil{width:34px;height:70px;margin:0 auto 4px;background:linear-gradient(#c5d4ea,#1d2c48);clip-path:polygon(32% 0,68% 0,84% 16%,100% 40%,76% 40%,72% 100%,28% 100%,24% 40%,0 40%,16% 16%)}
.fig.t1 .sil{background:linear-gradient(#d7c4a8,#3a2a22);height:78px}
.fig.t2 .sil{background:linear-gradient(#b9d7c8,#1d3330)}
.fig.t3 .sil{background:linear-gradient(#e7c2b4,#3a2424)}
.fig.t4 .sil{background:linear-gradient(#c9cdd6,#242833);height:74px}
.fig.you .sil{background:linear-gradient(var(--primary),#10203d);height:76px}
.fig small{display:block;color:var(--text2);font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .sheet{background:var(--bg2);border:1px solid var(--line);width:min(560px,100%);max-height:86dvh;overflow:auto;padding:14px;box-shadow:var(--shadow)}
.battle{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#0A1222;border-top:2px solid var(--primary);padding:10px 12px 12px;max-height:48dvh;overflow:auto}
.skills{display:flex;gap:8px;overflow-x:auto}
.skill{flex:0 0 148px;background:#121C33;border:1px solid var(--primary);padding:8px;min-height:78px;text-align:left}
.skill b{display:block}
.bar{height:8px;background:#0B1220;border:1px solid var(--line);margin:4px 0 8px}
.bar span{display:block;height:100%;background:var(--danger)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#052e1c;color:#D1FAE5;border:1px solid #34D399;padding:10px 14px;z-index:70;max-width:90vw;display:none}
.tip{display:none;background:#121C33;color:var(--gold);padding:8px;margin:8px 0;border:1px solid var(--line);font-size:13px}
.rankgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rankgrid button{margin:0;padding:8px 0}
.event{border-color:var(--warn)}
.hp-me span{background:var(--ok)}
.board{width:100%;border-collapse:collapse;font-size:13px}
.board td{border-bottom:1px solid var(--line);padding:6px 4px}
.me-row{color:var(--primary)}
.hide{display:none !important}
@media (min-width:960px){
  .layout{display:grid;grid-template-columns:1fr 280px;gap:12px}
  .desk{display:block}
  .modal{align-items:center}
  .top-actions{width:auto;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  .sos.pulse{animation:none}
}
</style>
</head>
<body data-theme="blue">
<div class="app" id="app">
  <header class="top">
    <div class="brand">ISA 超协终端<small id="brandSub">国际超常者联合协定</small></div>
    <div class="top-actions">
      <button class="small ghost" id="btnSave" type="button">保存存档</button>
      <button class="small ghost" id="btnLoad" type="button">读取存档</button>
      <button class="small ghost" id="btnReset" type="button">新开周目</button>
      <button class="sos" id="btnSos" type="button">紧急求助</button>
    </div>
  </header>
  <div class="hud" id="hud"></div>
  <div class="clock" id="clockLine"></div>

  <section id="phase-gate" class="view">
    <div class="card">
      <h3>欢迎登入超协</h3>
      <p class="muted">Welcome to join the International Superhuman Assembly</p>
      <p class="muted">信号正常 · 上海接入点</p>
      <div class="row">
        <button id="btnGoLogin" type="button">登录</button>
        <button class="ghost" id="btnGoReg" type="button">注册</button>
      </div>
      <p class="muted">登录：旧档案回归，可选权限。注册：新档固定 D 级。</p>
    </div>
  </section>

  <section id="phase-form" class="view hide">
    <div class="card">
      <h3 id="formTitle">信息录入</h3>
      <div id="regTip" class="tip"></div>
      <input id="regName" placeholder="姓名" maxlength="16">
      <input id="regCode" placeholder="代号" maxlength="16">
      <select id="regGender"><option value="男">男</option><option value="女">女</option><option value="保密">保密</option></select>
      <input id="regAge" placeholder="年龄" maxlength="3" inputmode="numeric">
      <input id="regFeature" placeholder="体表特征" maxlength="40">
      <textarea id="regAbility" placeholder="异能档案简述" maxlength="80"></textarea>
      <div class="row">
        <button id="btnSubmitId" type="button">确认并接入</button>
        <button class="ghost" id="btnBackGate" type="button">返回</button>
      </div>
    </div>
  </section>

  <section id="phase-rank" class="view hide">
    <div class="card">
      <h3 id="rankTitle">权限等级</h3>
      <p class="muted" id="rankHint"></p>
      <div class="rankgrid" id="rankGrid"></div>
      <button id="btnEnterTerm" class="hide" type="button">进入终端</button>
    </div>
  </section>

  <section id="phase-term" class="view hide">
    <div class="tabs" id="tabWrap">
      <button class="tab on" data-tab="public" type="button">公屏</button>
      <button class="tab" data-tab="mission" type="button">任务<span id="dotMission" class="dot hide">!</span></button>
      <button class="tab" data-tab="trade" type="button">交易<span id="dotTrade" class="dot hide">!</span></button>
      <button class="tab" data-tab="comms" type="button">通讯<span id="dotComms" class="dot hide">!</span></button>
      <button class="tab" data-tab="board" type="button">排行榜</button>
      <button class="tab" data-tab="profile" type="button">个人</button>
      <button class="tab" data-tab="news" type="button">新闻<span id="dotNews" class="dot hide">!</span></button>
      <button class="tab" data-tab="team" type="button">队伍</button>
      <button class="tab" data-tab="setting" type="button">AI配置</button>
    </div>
    <div class="layout">
      <div>
        <div class="view page" id="page-public">
          <div class="card">
            <div class="row">
              <strong id="whoHead"></strong>
              <span class="muted" id="chanLabel"></span>
            </div>
            <div class="row">
              <select id="chanSelect" style="max-width:220px"></select>
              <button class="small ghost" id="btnTranslate" type="button">翻译</button>
            </div>
            <div class="chat" id="publicChat"></div>
            <div class="row">
              <input class="grow" id="publicInput" placeholder="输入发言内容" maxlength="50">
              <button id="btnSendPublic" type="button">发送</button>
              <button class="ghost" id="btnPic" type="button">+</button>
              <input id="picFile" type="file" accept="image/*" class="hide">
            </div>
          </div>
          <div id="eventSlot"></div>
        </div>
        <div class="view page hide" id="page-mission"><div class="card"><h3>任务</h3><div id="missionList"></div><div id="missionActive"></div></div></div>
        <div class="view page hide" id="page-trade">
          <div class="card">
            <div class="row">
              <button id="btnMarketOfficial" type="button">官方集市</button>
              <button class="ghost" id="btnMarketGray" type="button">灰色集市</button>
            </div>
            <p class="muted" id="marketNote"></p>
            <div id="tradeList"></div>
          </div>
          <div class="card"><h3>背包</h3><div id="bagList"></div></div>
        </div>
        <div class="view page hide" id="page-comms"><div class="card"><h3>通讯</h3><div id="threadList"></div><div id="threadView"></div></div></div>
        <div class="view page hide" id="page-board"><div class="card"><h3>排行榜</h3><div id="boardBox"></div></div></div>
        <div class="view page hide" id="page-profile"><div class="card" id="profileBox"></div></div>
        <div class="view page hide" id="page-news"><div class="card"><h3>新闻</h3><div id="newsList"></div></div></div>
        <div class="view page hide" id="page-team">
          <div class="card">
            <h3>队友站位</h3>
            <p class="muted">横屏时近大远小。好感越高，站得越近。</p>
            <div class="stage" id="formation"></div>
            <div id="teamList"></div>
          </div>
        </div>
        <div class="view page hide" id="page-setting">
          <div class="card">
            <h3>AI接口配置</h3>
            <div id="apiTip" class="tip"></div>
            <p class="muted">不填密钥也能玩，终端用内置剧情引擎。填写后，豆包 / DeepSeek 等只负责叙事，数值仍由终端结算。</p>
            <select id="apiMode">
              <option value="doubao">豆包（火山方舟）</option>
              <option value="deepseek">DeepSeek</option>
              <option value="glm">智谱GLM</option>
              <option value="qwen">通义千问</option>
              <option value="kimi">Kimi</option>
            </select>
            <input id="apiKey" placeholder="API Key" autocomplete="off">
            <p class="muted">密钥只留在这台浏览器里。</p>
            <input id="customModelName" placeholder="自定义模型名称（选填）">
            <label class="muted">temperature <input id="apiTemp" value="0.7" inputmode="decimal"></label>
            <label class="muted">最大输出 token <input id="apiTokens" value="800" inputmode="numeric"></label>
            <button id="btnSaveApi" type="button">保存配置</button>
          </div>
        </div>
      </div>
      <aside class="desk">
        <div class="card">
          <h3>侧栏</h3>
          <div id="sideBox" class="muted"></div>
        </div>
      </aside>
    </div>
  </section>
</div>

<div id="modal" class="modal hide"></div>
<div id="battleUI" class="battle hide"></div>
<div id="toast" class="toast"></div>

function normalize(s){
  var d = defaultState();
  if (!s || typeof s !== "object") return d;
  Object.keys(d).forEach(function(k){ if (s[k] === undefined) s[k] = d[k]; });
  if (!s.player) s.player = d.player;
  Object.keys(d.player).forEach(function(k){ if (s.player[k] === undefined) s.player[k] = d.player[k]; });
  if (!s.apiConfig) s.apiConfig = d.apiConfig;
  if (!s.storyFlags) s.storyFlags = {};
  if (!s.chats) s.chats = {};
  return s;
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function clamp(n,a,b){ n = Number(n)||0; return Math.max(a, Math.min(b, n)); }
function pad(n){ n = Math.floor(n); return (n<10?"0":"")+n; }
function rid(p){ return p + Math.random().toString(36).slice(2,8); }
function teammateById(id){
  for (var i=0;i<teammateDatabase.length;i++) if (teammateDatabase[i].teammateId===id) return teammateDatabase[i];
  return null;
}
function castByCode(code){
  for (var i=0;i<CAST.length;i++) if (CAST[i].code===code || CAST[i].name===code || CAST[i].id===code) return CAST[i];
  return null;
}
function faceOf(senderId, emotion){
  var tm = teammateById(senderId);
  if (tm) return tm.emotionMap[emotion] || tm.emotionMap.normal;

  if (c) return c.emotionMap[emotion] || c.emotionMap.normal;
  return FACES[emotion] || FACES.normal;
}

function saveApiConfig() {
  console.log("执行保存API配置");
  var modeEl = document.getElementById("apiMode");
  var keyEl = document.getElementById("apiKey");
  var nameEl = document.getElementById("customModelName");
  var btn = document.getElementById("btnSaveApi");
  if (!modeEl || !keyEl || !nameEl || !btn) {

    return;
  }
  var mode = modeEl.value;
  var key = keyEl.value.trim();
  var cname = nameEl.value.trim();
  if (!API_CONFIG_MAP[mode]) {
    alert("未知的API模式：" + mode);
    return;
  }
  gameState.apiConfig.mode = mode;
  gameState.apiConfig.key = key;
  gameState.apiConfig.modelName = cname || API_CONFIG_MAP[mode].defaultModel;
  var tempEl = document.getElementById("apiTemp");
  var tokEl = document.getElementById("apiTokens");
  if (tempEl) gameState.apiConfig.temperature = Math.min(1.5, Math.max(0, Number(tempEl.value) || 0.7));

  try {
    localStorage.setItem("isaGameState", JSON.stringify(gameState));
    localStorage.setItem("customItemDatabase", JSON.stringify(customItemDatabase));
  } catch (e) {
    alert("保存失败：" + e.message);

  var oldText = btn.innerText;
  btn.innerText = "已保存 ✓";

    btn.style.background = "";

function clockParts(){
  var mins = 22*60 + 18 + gameState.gameTick * 13 + gameState.dayExtra * 24 * 60;
  var days = Math.floor(mins / (24*60));
  mins = mins % (24*60);
  return {h:Math.floor(mins/60), m:mins%60, day:9+days};
}
function clockText(){
  var c = clockParts();
  var where = gameState.outside ? gameState.location : "上海·超协终端";
  return "10月" + c.day + "日 " + pad(c.h) + ":" + pad(c.m) + "  |  " + where;
}

function syncVitals(){
  var life = gameState.player.life;
  var sp = gameState.player.spirit;
  if (gameState.dead || life <= 0){ gameState.lifeState = "死亡"; }
  else if (life < 15) gameState.lifeState = "濒死";
  else if (life < 35) gameState.lifeState = "重伤";
  else if (life < 70) gameState.lifeState = "轻伤";
  else gameState.lifeState = "正常";
  if (sp < 15) gameState.spiritState = "崩溃";
  else if (sp < 30) gameState.spiritState = "混乱";
  else if (sp < 55) gameState.spiritState = "污染";
  else gameState.spiritState = "正常";
  if (gameState.activeMission && /裂|管廊|水厂|暗界/.test(missionTitle(gameState.activeMission.id))) gameState.signal = "异常";
  else if (gameState.outside && gameState.wantedLevel >= 2) gameState.signal = "异常";
  else gameState.signal = "正常";
}
function changeLife(d){
  if (gameState.dead) return;
  gameState.player.life = clamp(gameState.player.life + d, 0, 100);
  syncVitals();
  if (gameState.player.life <= 0){
    gameState.dead = true;
    gameState.battleState = false;
    saveGame(true);
    renderAll();
    openDeath();
  }
}
function changeSpirit(d){
  gameState.player.spirit = clamp(gameState.player.spirit + d, 0, 100);
  syncVitals();
}
function changeScore(d){
  var before = gameState.player.globalRank;
  gameState.player.score = Math.max(0, gameState.player.score + d);
  var gain = gameState.player.score - gameState.player.startScore;
  var next = Math.max(1, gameState.player.startRank - Math.floor(gain / 35));
  if (next < before){
    gameState.rankToast = {from:before, to:next};
    pushNotice("排名变动","你的全球名次从第"+before+"升到第"+next+"。盯着你的人会变多。","rank");
  } else if (next > before + 15){
    gameState.rankToast = {from:before, to:next};
    pushNotice("排名变动","名次跌到第"+next+"。","rank");
  }
  gameState.player.globalRank = next;
}
function changeSur(d){
  if (!d) return;
  if (d > 0) d = Math.round(d * surMul());
  var prev = gameState.isaSurveillance;
  gameState.isaSurveillance = clamp(prev + d, 0, 100);
  var s = gameState.isaSurveillance;
  if (s >= 75 && gameState.interviewStage < 3){ gameState.interviewStage = 3; queueInterview("summon"); }
  else if (s >= 50 && gameState.interviewStage < 2){ gameState.interviewStage = 2; queueInterview("second"); }
  else if (s >= 30 && gameState.interviewStage < 1){ gameState.interviewStage = 1; queueInterview("warn"); }
  if (s >= 100 && !gameState.storyFlags.demoted){
    gameState.storyFlags.demoted = true;
    demote();
  }
    }
  function demote(){
  var order = ["S","A","B","C","D","E","F"];
  var i = order.indexOf(gameState.player.rank);
  if (i < 0) i = 3;
  if (i < order.length-1){
    gameState.player.rank = order[i+1];
    pushNotice("权限降级","监视值打满。权限降为 "+gameState.player.rank+"。","danger");
  }
}

  function missionById(id){
  for (var i=0;i<MISSIONS.length;i++) if (MISSIONS[i].missionId===id) return MISSIONS[i];
  var extra = gameState.extraMissions || [];
  for (var j=0;j<extra.length;j++) if (extra[j].missionId===id) return extra[j];
  return null;
}
function missionTitle(id){ var m = missionById(id); return m ? m.title : ""; }
function missionOpen(m){
  if (!m) return false;
  if (gameState.doneMissions.indexOf(m.missionId)>=0) return false;
  var line = gameState.mainLine;
  if (m.line && m.line.indexOf(line)<0 && !(line==="unselected" && m.line.indexOf("unselected")>=0)) return false;
  if (gameState.wantedLevel < (m.minWanted||0)) return false;
  if (gameState.wantedLevel > (m.maxWanted==null?3:m.maxWanted)) return false;
  if (gameState.wantedLevel >= 1 && (m.missionId==="south" || m.missionId==="conduit" || m.missionId==="plant") && line!=="normalFree"){
    if (line==="official") return gameState.wantedLevel===0;
  }
  if ((m.missionId==="south"||m.missionId==="conduit"||m.missionId==="plant") && gameState.wantedLevel>=1 && !officialLock()) return false;
  return true;
}

function acceptMission(id){
  if (gameState.dead) return;
  if (gameState.mainLine==="unselected") return toast("先处理禁塔邀请");
  if (gameState.activeMission) return toast("先把当前任务做完");
  var m = missionById(id);
  if (!m || !missionOpen(m)) return toast("这条现在接不了");
  gameState.activeMission = {id:id, step:0};
  gameState.location = "上海·任务现场";
  tick("mission");
  renderAll();
}
function finishMission(kind){
  var act = gameState.activeMission;
  if (!act) return;
  var m = missionById(act.id);
  gameState.activeMission = null;
  gameState.location = "上海·超协终端";
  gameState.signal = "正常";
  if (!m) return;
  if (kind==="win"){
    gameState.doneMissions.push(m.missionId);
    changeScore(m.reward);
    changeSpirit(6);
    toast("任务完成 +"+m.reward+" 积分");
    gameState.team.forEach(function(tid){
      gameState.teammateFavor[tid] = clamp((gameState.teammateFavor[tid]||40)+6,0,100);
      gameState.withCount[tid] = (gameState.withCount[tid]||0)+1;
      gameState.teammateEmotion[tid] = "happy";
    });
    afterMissionStory(m);
  } else if (kind==="partial"){
    changeScore(Math.floor(m.reward/3));
    toast("任务中止，拿了一小笔");
  } else {
    gameState.failedMissions.push(m.missionId);
    changeSpirit(-8);
    toast("任务失败");
    gameState.team.forEach(function(tid){ gameState.teammateEmotion[tid] = "tired"; });
  }
  maybeUnlockNext();
}
function afterMissionStory(m){

    pushChat("中国·上海",{sender:"外滩夜班",text:"旧水厂方向有刀光。不是禁塔的制式。",emotion:"serious"});

function chooseStep(index){
  var act = gameState.activeMission;
  if (!act) return;
  var m = missionById(act.id);
  if (!m) return;
  var step = m.steps[act.step];
  if (!step) return finishMission("win");
  var c = step.choices[index];
  if (!c) return;
  if (c.needTeam && gameState.team.length===0) return toast("你现在没有队友");
  if (c.flag) gameState.storyFlags[c.flag] = true;
  if (c.sur) changeSur(c.sur);
  if (c.recruit) recruit(c.recruit, true);
  if (c.meet) meet(c.meet);
  if (c.battle){
    startBattle(c.battle, {missionId:act.id, winStep:c.win, lose:c.lose||"fail"});
    return;
  }
  if (c.fail){ finishMission("fail"); renderAll(); return; }
  if (c.partial){ finishMission("partial"); renderAll(); return; }
  if (c.end){ finishMission("win"); renderAll(); return; }
  if (typeof c.next === "number"){
    act.step = c.next;
    fixDynamicStep();
    tick("mission");
    renderAll();
  }
}
function fixDynamicStep(){
  var act = gameState.activeMission;
  if (!act || act.id!=="conduit" || act.step!==3) return;
  var m = missionById("conduit");
  var who = officialLock() ? "楚澜" : "灰塔中间人";
  var line = officialLock() ? "别急。先把血止住，再谈你看到了什么。" : "样本呢？没有也行，人活着就有价。";
  m.steps[3] = {text: who+"站在出口，雨披上没有徽章。",speaker:who,line:line,choices:[{label:"听完再走",end:true}]};
}

function recruit(id, silent){

function startBattle(enemyId, ret){
  var en = ENEMIES[enemyId];
  if (!en) return;
  gameState.battleState = true;
  gameState.battleData = {enemyId:enemyId, hp:en.hp, maxHp:en.hp, guard:false, cds:{}, ret:ret||null};
  gameState.battleLog = [{text:en.tier+" · "+en.name+" 挡在前面。",cls:"sys"}];
  gameState.signal = "异常";
  syncVitals();
  renderAll();
}
  function skillLabel(sk){
  var ab = (gameState.player.ability || "镜面空间").slice(0,8);
  if (sk.skillId==="normal_strike") return ab+"·输出";
  if (sk.skillId==="mirror_fold") return ab+"·折叠";
  return sk.name;
}
function useSkill(skillId){
  if (!gameState.battleState || gameState.dead) return;
  var sk = null;
  for (var i=0;i<skillDatabase.length;i++) if (skillDatabase[i].skillId===skillId) sk = skillDatabase[i];
  if (!sk) return;
  var bd = gameState.battleData;
  if ((bd.cds[skillId]||0) > 0) return toast("技能冷却中");
  if (gameState.player.spirit < sk.cost) return toast("精神不够");
  changeSpirit(-sk.cost);
  if (sk.cd) bd.cds[skillId] = sk.cd;
  var text = "你释放【"+skillLabel(sk)+"】";
  if (sk.guard){
    bd.guard = true;
    text += "，镜壁立住。";
  } else {
    var dmg = sk.power + Math.floor(Math.random()*6) + gameState.team.length*2 + (gameState.buff.dmg>0?10:0);
    if (bd.enemyId==="red_arm" && gameState.buff.spike) dmg += 12;
    bd.hp -= dmg;
    text += "，造成 "+dmg+" 点伤害。";
    if (gameState.team.length){
      var helper = teammateById(gameState.team[0]);
      text += helper ? " "+helper.name+"跟上一击。" : "";
    }
  }
  gameState.battleLog.push({text:text, cls:"me"});
  if (bd.hp <= 0) return endBattle("win");
  enemyTurn();
  if (gameState.dead || !gameState.battleData) return;
  if (gameState.buff.dmg>0) gameState.buff.dmg--;
  if (gameState.buff.weak>0) gameState.buff.weak--;
  Object.keys(bd.cds).forEach(function(k){ if (bd.cds[k]>0) bd.cds[k]--; });
  saveGame(true);
  renderAll();
}
function enemyTurn(){
  var bd = gameState.battleData;
  if (!bd) return;
  var en = ENEMIES[bd.enemyId];
  var dmg = en.atk + Math.floor(Math.random()*5);
  if (gameState.buff.weak>0) dmg = Math.floor(dmg*0.55);
  if (bd.guard){ dmg = Math.floor(dmg*0.4); bd.guard = false; }
  var line = en.name+"撞上来，你失去 "+dmg+" 点生命。";
  if (bd.enemyId==="bone") line = "骨刃刮过肩。"+line;
  gameState.battleLog.push({text:line, cls:"foe"});
  if (gameState.team.length && Math.random()<0.35){
    var tid = gameState.team[Math.floor(Math.random()*gameState.team.length)];
    gameState.teammateLife[tid] = clamp((gameState.teammateLife[tid]||100)-12, 0, 100);
    var tm = teammateById(tid);
    gameState.teammateEmotion[tid] = "angry";
    gameState.battleLog.push({text:(tm?tm.name:"队友")+"替你挡了一下。", cls:"sys"});
    if ((gameState.teammateLife[tid]||0) < 25 && Math.random()<0.5){
      gameState.team = gameState.team.filter(function(x){ return x!==tid; });
      if (gameState.friends.indexOf(tid)<0) gameState.friends.push(tid);
      gameState.battleLog.push({text:(tm?tm.name:"队友")+"撑不住，先撤出战线。档案还在。", cls:"sys"});
    }
  }
  changeLife(-dmg);
  if (gameState.battleLog.length>30) gameState.battleLog.shift();
}
function endBattle(result){
  var bd = gameState.battleData;
  var ret = bd && bd.ret;
  gameState.battleState = false;
  gameState.battleData = null;
  if (result==="win"){
    gameState.battleLog.push({text:"目标倒下。",cls:"sys"});
    changeScore(40);
    changeSpirit(4);
    if (ret && ret.missionId && gameState.activeMission && gameState.activeMission.id===ret.missionId){
      if (ret.win==="end" || ret.win===true) finishMission("win");
      else if (typeof ret.win==="number"){ gameState.activeMission.step = ret.win; fixDynamicStep(); }
    }
    toast("战斗胜利");
  } else if (result==="retreat"){
    changeSpirit(-6);
    toast("你撤出了战斗");
    if (ret && ret.lose==="fail") finishMission("fail");
  } else {
    if (ret && ret.lose==="fail") finishMission("fail");
  }
  if (!gameState.dead){
    gameState.signal = gameState.activeMission ? "异常" : "正常";
    saveGame(true);
    renderAll();
  }
}

function buyItem(itemId){
  var it = itemById(itemId);
  if (!it) return;
  var gray = (it.risk||"").indexOf("违禁")>=0;
  if (gray && gameState.marketType!=="gray") return;
  if (!gray && gameState.marketType==="gray") return;
  if (gameState.wantedLevel>=2 && !gray) return toast("官方集市已锁死");
  if (gameState.player.score < it.price) return toast("积分不足");
  changeScore(-it.price);
  var ex = null;
  for (var i=0;i<gameState.inventory.length;i++) if (gameState.inventory[i].itemId===itemId) ex = gameState.inventory[i];
  if (ex) ex.count++; else gameState.inventory.push({itemId:itemId,count:1});
  if (gray){
    changeSur(6);
    gameState.contrabandBuys++;
    if (!officialLock() && gameState.contrabandBuys>=3) setWanted(Math.max(gameState.wantedLevel,1));
    if (!officialLock() && gameState.contrabandBuys>=5) setWanted(Math.max(gameState.wantedLevel,2));
  }
  tick("trade");
  saveGame(true);
  renderAll();
  toast("已购入 "+it.name);
}
function useItem(idx){
  var inv = gameState.inventory[idx];
  if (!inv) return;
  var it = itemById(inv.itemId);
  inv.count--;
  if (inv.count<=0) gameState.inventory.splice(idx,1);
  var beat = applyItemFx(inv.itemId, it);
  closeModal();
  var payload = buildPayload("useItem", {itemId:inv.itemId});
  fetchOrLocal(payload, function(res){
    var line = (res && res.storyBeat) ? res.storyBeat : beat;
    pushNotice("道具", (it?it.name:"道具")+"："+line, "info");
    if (res) applyAiPatch(res);
    saveGame(true);
    renderAll();
  });
}

function fetchAI(payloadObj){
  var mode = gameState.apiConfig.mode;
  var key = (gameState.apiConfig.key||"").trim();
  var modelName = gameState.apiConfig.modelName || (API_CONFIG_MAP[mode] && API_CONFIG_MAP[mode].defaultModel);
  if (!key) return Promise.resolve(null);
  if (!API_CONFIG_MAP[mode]){ alert("未知的API模式"); return Promise.resolve(null); }
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 20000);
  function once(withFormat){
    var body = {
      model: modelName,
      temperature: gameState.apiConfig.temperature || 0.7,
      max_tokens: gameState.apiConfig.maxTokens || 800,
      messages:[
        {role:"system", content:SYSTEM_PROMPT},
        {role:"user", content:JSON.stringify(payloadObj)}
      ]
    };
    if (withFormat) body.response_format = {type:"json_object"};
    return fetch(API_CONFIG_MAP[mode].url, {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify(body),
      signal: ctrl.signal
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); });
  }
  return once(true).then(function(res){
    if (!res.ok) return once(false);
    return res;
  }).then(function(res){
    clearTimeout(timer);
    if (!res || !res.ok){
      var msg = (res && res.json && (res.json.error && (res.json.error.message||res.json.error) || res.json.message)) || "请求失败";
      alert("AI请求失败："+msg+"。已改用本地剧情。");
      return null;
    }
    var txt = res.json && res.json.choices && res.json.choices[0] && res.json.choices[0].message && res.json.choices[0].message.content;
    if (!txt){ alert("AI没有返回内容。已改用本地剧情。"); return null; }
    txt = String(txt).replace(/```json/g,"").replace(/```/g,"").trim();
    try { return JSON.parse(txt); }
    catch (e){ alert("AI返回的不是合法JSON。已改用本地剧情。"); return null; }
  }).catch(function(err){
    clearTimeout(timer);
    alert("AI请求失败："+(err && err.message ? err.message : "网络错误")+"。已改用本地剧情。");
    return null;
  });
}

function fetchOrLocal(payload, done){
  var trigger = payload.triggerType;
  fetchAI(payload).then(function(res){
    if (!res){
      if (trigger==="publicMsg") res = {publicMessages: localPublic(payload.payload && payload.payload.msg)};
      else res = {storyBeat:""};
    }
    done(res);
  });
}

  function sendDm(id){
  var input = document.getElementById("dmInput");
  if (!input) return;
  var val = input.value.trim();
  if (!val) return;
  pushDm(id, gameState.player.code, val, "normal");
  var tm = teammateById(id);
  if (tm){
    var fav = gameState.teammateFavor[id] || 40;
    gameState.teammateFavor[id] = clamp(fav+2,0,100);
    var reply = teammateReply(tm, val, gameState.teammateFavor[id]);
    pushDm(id, tm.name, reply, fav>70?"happy":"normal");
    gameState.teammateEmotion[id] = fav>70?"happy":"normal";
  } else {
    var c = castByCode(id);
    if (c) pushDm(id, c.code, castReply(c, val), "normal");
  }
  saveGame(true);
  renderComms();
}
function teammateReply(tm, val, fav){
  if (tm.teammateId==="te_02" && tm){
    if (gameState.team.indexOf("te_03")>=0 && Math.random()<0.5) return "唐狩又在催。你让她别拆我的焊枪。";
  }
  if (tm.teammateId==="te_03") return fav>60 ? "小满说你还行。她很少夸人。" : "有事说事。";
  if (tm.teammateId==="te_04") return "利弊我听到了。情绪没有计算项。";
  if (tm.teammateId==="te_01"){
    if (fav>=80 && gameState.player.gender==="男") return "你要是不在，这活我不一定接。当我没说。";
    if (fav>=80) return "今天的残骸我自己处理。你别碰，脏。";
    if (fav<50) return "哈哈，行。我跟着。别问我背上是什么。";
    return "我在。别的等打完再说。";
  }
  return "听到了。";
}
function castReply(c){
  if (c.id==="gilt") return "哈。说完了？";
  if (c.id==="siren") return "是吗。你继续。";
  if (c.id==="e") return "所以？";
  if (c.id==="kensei") return "……";
  if (c.id==="heim") return "嗯。伤口呢，还是闲聊？";
  if (c.id==="hestia") return "别急。一句一句说。";
  if (c.id==="simple") return "啧。没试剂就别发。";
  if (c.id==="night") return "哈哈。";
  return "收到。";
}

    stage.innerHTML = figs;
    var html = "";
    if (!gameState.team.length) html += "<p class='muted'>队伍里还没有人。先把南郊那单做了。</p>";
    gameState.team.forEach(function(tid){
      var tm = teammateById(tid);
      var fav = gameState.teammateFavor[tid]||40;
      html += "<div class='card'><h4>"+esc(tm.name)+"【"+esc(tm.code)+"】"+esc(tm.emotionMap[gameState.teammateEmotion[tid]||"normal"])+"</h4><p>"+esc(tm.desc)+"</p><p class='muted'>生命 "+(gameState.teammateLife[tid]||100)+" · 精神 "+(gameState.teammateSpirit[tid]||100)+" · 好感 "+fav+"</p><button type='button' data-talk='"+tid+"'>私聊</button><button class='danger' type='button' data-kick='"+tid+"'>踢出</button></div>";
    });
    var pool = ["te_01","te_02","te_03","te_04"];
    pool.forEach(function(tid){
      if (gameState.team.indexOf(tid)>=0) return;
      if (gameState.met.indexOf(tid)<0 && tid!=="te_01") return;
      if (tid==="te_01" && gameState.met.indexOf("te_01")<0 && gameState.doneMissions.indexOf("south")<0) return;
      var tm = teammateById(tid);
      var ok = canRecruit(tid);
      html += "<div class='card'><h4>可结识 · "+esc(tm.name)+"</h4><p class='muted'>"+(ok?"可以招募":"顺序未到")+"</p>"+(ok?"<button type='button' data-join='"+tid+"'>招募</button>":"")+"</div>";
    });
    list.innerHTML = html;
    list.querySelectorAll("[data-talk]").forEach(function(b){ b.onclick=function(){ gameState.thread=b.getAttribute("data-talk"); switchTab("comms"); }; });
    list.querySelectorAll("[data-kick]").forEach(function(b){ b.onclick=function(){ kickTeammate(b.getAttribute("data-kick")); }; });
    list.querySelectorAll("[data-join]").forEach(function(b){ b.onclick=function(){ recruit(b.getAttribute("data-join")); renderAll(); }; });
  }

  function renderBattle(){
    var ui = document.getElementById("battleUI");
    if (!ui) return;
    if (!gameState.battleState || !gameState.battleData){ ui.className = "battle hide"; return; }
    var bd = gameState.battleData;
    var en = ENEMIES[bd.enemyId];
    var skills = skillDatabase.map(function(sk){
      var cd = bd.cds[sk.skillId]||0;
      return "<button type='button' class='skill' data-sk='"+sk.skillId+"'><b>"+esc(skillLabel(sk))+"</b>精神"+sk.cost+" 冷却"+(cd||sk.cd)+"</button>";
    }).join("");
    var logs = gameState.battleLog.map(function(l){ return "<div class='msg'>"+esc(l.text)+"</div>"; }).join("");
    ui.className = "battle";
    ui.innerHTML = "<h3>战斗 · "+esc(en.name)+"</h3><div class='bar'><span style='width:"+(bd.hp/bd.maxHp*100)+"%'></span></div><div class='muted'>敌方 "+bd.hp+"/"+bd.maxHp+" · 你的生命 "+gameState.player.life+" · 精神 "+gameState.player.spirit+"</div><div class='skills'>"+skills+"</div><button type='button' class='ghost' id='btnFlee'>战术撤离</button><div class='chat' style='height:120px'>"+logs+"</div>";
    ui.querySelectorAll("[data-sk]").forEach(function(b){ b.onclick=function(){ useSkill(b.getAttribute("data-sk")); }; });
    document.getElementById("btnFlee").onclick = function(){ endBattle("retreat"); };
  }

  function renderSide(){
    var box = document.getElementById("sideBox");
    if (!box) return;
    var latest = gameState.newsEntries[0];
    box.innerHTML = "<p>路线："+esc(gameState.mainLine)+"</p><p>队伍："+(gameState.team.map(function(id){ var t=teammateById(id); return t?t.name:id; }).join("、")||"无")+"</p>"+(latest?"<p>最新："+esc(latest.title)+"</p>":"<p>新闻还没来。</p>");
  }

  function renderPage(){
    if (gameState.tab==="public") renderPublic();
    if (gameState.tab==="mission") renderMissions();
    if (gameState.tab==="trade") renderTrade();
    if (gameState.tab==="comms") renderComms();
    if (gameState.tab==="board") renderBoard();
    if (gameState.tab==="profile") renderProfile();
    if (gameState.tab==="news") renderNews();
    if (gameState.tab==="team") renderTeam();
    renderSide();
  }

  function renderAll(){
    showPhase();
    renderHud();
    renderDots();
    if (gameState.phase==="term" || gameState.phase==="street"){
      switchTab(gameState.tab||"public");
    }
    renderBattle();
    if (gameState.rankToast){
      var rk = gameState.rankToast;
      gameState.rankToast = null;
      openModal("排名变化", "<p>第 "+rk.from+" 位 → 第 "+rk.to+" 位</p><p class='muted'>积分变动会改写别人看你的方式，不会改写旧账。</p>", "");
    }
    var modeEl = document.getElementById("apiMode");
    if (modeEl && gameState.apiConfig){
      modeEl.value = gameState.apiConfig.mode || "deepseek";
      if (document.activeElement!==document.getElementById("apiKey")) document.getElementById("apiKey").value = gameState.apiConfig.key || "";
      if (document.activeElement!==document.getElementById("customModelName")) document.getElementById("customModelName").value = gameState.apiConfig.modelName || "";
      document.getElementById("apiTemp").value = gameState.apiConfig.temperature || 0.7;
      document.getElementById("apiTokens").value = gameState.apiConfig.maxTokens || 800;
    }
  }

  function beginForm(mode){
    gameState.authMode = mode;
    gameState.phase = "form";
    document.getElementById("formTitle").textContent = mode==="login" ? "登录 · 信息核对" : "注册 · 建立档案";
    renderAll();
  }
  function submitId(){
    var name = document.getElementById("regName").value.trim();
    var code = document.getElementById("regCode").value.trim();
    var age = document.getElementById("regAge").value.trim();
    var feature = document.getElementById("regFeature").value.trim();
    var ability = document.getElementById("regAbility").value.trim();
    var gender = document.getElementById("regGender").value;
    if (!name || !code || !age || !feature || !ability) return showTip("regTip","五项都要填");
    if (!/^\d{1,3}$/.test(age) || Number(age)<10 || Number(age)>80) return showTip("regTip","年龄写 10 到 80");
    gameState.player.name = name;
    gameState.player.code = code.slice(0,16);
    gameState.player.age = age;
    gameState.player.gender = gender;
    gameState.player.feature = feature;
    gameState.player.ability = ability;
    gameState.phase = "rank";
    var grid = document.getElementById("rankGrid");
    var hint = document.getElementById("rankHint");
    var enter = document.getElementById("btnEnterTerm");
    if (gameState.authMode==="register"){
      gameState.player.rank = "D";
      gameState.player.score = 100;
      gameState.player.startScore = 100;
      gameState.player.startRank = 860;
      gameState.player.globalRank = 860;
      hint.textContent = "新注册等级固定为 D，只能靠任务和贡献升。选定后不能在这里改。";
      grid.innerHTML = "<p style='color:#F87171'>无法修改 · 当前 D</p>";
      enter.className = "";
      enter.onclick = enterTerminal;
    } else {
      hint.textContent = "登录档案可选权限。选定后不能随意修改。";
      var ranks = ["S","A","B","C","D","E","F"];
      grid.innerHTML = ranks.map(function(r){ return "<button type='button' data-rk='"+r+"'>"+r+"</button>"; }).join("");
      grid.querySelectorAll("button").forEach(function(b){
        b.onclick = function(){
          applyStartRank(b.getAttribute("data-rk"));
          enter.className = "";
          enter.onclick = enterTerminal;
          toast("权限定为 "+gameState.player.rank);
        };
      });
      enter.className = "hide";
    }
    document.getElementById("rankTitle").textContent = gameState.authMode==="login" ? "欢迎回来，"+code : code+"，你已成为超协的一员";
    renderAll();
  }
  function applyStartRank(r){
    var table = {S:[5200,12],A:[2600,36],B:[1200,90],C:[500,240],D:[100,860],E:[40,2400],F:[10,6200]};
    var row = table[r] || table.D;
    gameState.player.rank = r;
    gameState.player.score = row[0];
    gameState.player.startScore = row[0];
    gameState.player.startRank = row[1];
    gameState.player.globalRank = row[1];
  }
  function enterTerminal(){
    seedChat();
    if (!gameState.notices.length){
      pushNotice("禁塔邀请","外部联络处：检测到你在上海登录。邀请你加入禁塔，接受后获得临时编制。","danger");
    }
    if (!gameState.newsEntries.length){
      addNews("紧急公告","魔都裂口异常增多","南郊、旧水厂、浦东管廊已被封控。市民口径仍是抢修。","禁塔");
      gameState.unreadNews = 1;
    }
    gameState.phase = "term";
    gameState.tab = "public";
    gameState.outside = false;
    saveGame(true);
    renderAll();
    if (gameState.mainLine==="unselected") openInvite();
  }

  function bind(){
    document.getElementById("btnSave").onclick = function(){ saveGame(false); };
    document.getElementById("btnLoad").onclick = loadGame;
    document.getElementById("btnReset").onclick = resetGame;
    document.getElementById("btnSos").onclick = openSos;
    document.getElementById("btnGoLogin").onclick = function(){ beginForm("login"); };
    document.getElementById("btnGoReg").onclick = function(){ beginForm("register"); };
    document.getElementById("btnBackGate").onclick = function(){ gameState.phase="gate"; renderAll(); };
    document.getElementById("btnSubmitId").onclick = submitId;
    document.getElementById("btnSaveApi").onclick = saveApiConfig;
    document.getElementById("btnSendPublic").onclick = sendPublic;
    document.getElementById("publicInput").addEventListener("keydown", function(e){ if (e.key==="Enter") sendPublic(); });
    document.getElementById("btnPic").onclick = function(){ document.getElementById("picFile").click(); };
    document.getElementById("picFile").onchange = function(){
      var f = this.files && this.files[0];
      if (!f) return;
      pushChat(gameState.channel, {type:"self",sender:gameState.player.code,text:"",pic:f.name.slice(0,24),emotion:"normal"});
      this.value = "";
      tick("talk");
      renderPublic();
    };
    document.getElementById("btnTranslate").onclick = function(){
      gameState.translateOn = !gameState.translateOn;
      this.textContent = gameState.translateOn ? "显示原文" : "翻译";
      renderPublic();
    };
    var sel = document.getElementById("chanSelect");
    Object.keys(CHANNELS).forEach(function(name){
      var o = document.createElement("option");
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    });
    sel.onchange = function(){
      gameState.channel = sel.value;
      gameState.translateOn = false;
      document.getElementById("btnTranslate").textContent = "翻译";
      ensureChannel(sel.value);
      renderPublic();
    };
    document.getElementById("btnMarketOfficial").onclick = function(){ gameState.marketType="official"; renderTrade(); };
    document.getElementById("btnMarketGray").onclick = function(){ gameState.marketType="gray"; renderTrade(); };
    document.querySelectorAll(".tab").forEach(function(t){ t.onclick = function(){ switchTab(t.getAttribute("data-tab"), {user:true}); }; });
    document.getElementById("publicChat").addEventListener("click", function(e){
      var who = e.target.closest ? e.target.closest(".who") : null;
      if (!who) return;
      var name = who.textContent.replace(/[【】]/g,"");
      if (name && name!=="你") openProfileCard(name);
    });
  }

  function boot(){
    try {
      seedChat();
      bind();
      if (!gameState.phase) gameState.phase = "gate";
      renderAll();
      setInterval(function(){
        if (gameState.phase!=="term" || gameState.dead || document.hidden) return;
        var pool = [
          {sender:"ds王",text:"警报又短了一声。",emotion:"tired"},
          {sender:"江雾",text:"北城水厂的灯不该是红的。",emotion:"serious"},
          {sender:"焊枪小吴",text:"谁接协同？我武器卡壳。",emotion:"normal"}
        ];
        if (Math.random()<0.55){
          pushChat("中国·上海", pool[Math.floor(Math.random()*pool.length)]);
          if (gameState.tab==="public" && gameState.channel==="中国·上海") renderPublic();
        }
      }, 18000);
      window.__ISA_READY = true;
    } catch (err) {
      alert("终端初始化失败：" + err.message);
    }
  }
  if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
